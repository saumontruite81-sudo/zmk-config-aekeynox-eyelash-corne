# Only build firmware for the actual Eyelash Corne OLED keyboard.
# Board: nice!nano v2 compatible; shields include our 128x32 I2C OLED setup.
#
# To recover BLE pairing, a separate nice_nano@2//zmk settings_reset build
# can be temporarily added if needed. Do not flash settings_reset routinely.
include:
  - board: nice_nano@2//zmk
    shield: eyelash_corne_left
    artifact-name: eyelash_corne_left

  - board: nice_nano@2//zmk
    shield: eyelash_corne_right
    artifact-name: eyelash_corne_right
